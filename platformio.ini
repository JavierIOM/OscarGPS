[env:firebeetle32]
platform = espressif32@6.13.0
board = firebeetle32
framework = arduino

upload_port = COM10
monitor_port = COM10
upload_speed = 921600
monitor_speed = 115200

; Bluetooth Classic pulls in ~1 MB; no OTA needed, so take the big app partition
board_build.partitions = huge_app.csv

build_flags =
    -DFW_VERSION=\"1.0.0\"
