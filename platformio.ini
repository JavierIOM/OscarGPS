[env:firebeetle32]
platform = espressif32@6.13.0
board = firebeetle32
framework = arduino

; Ports are auto-detected. To pin one: upload_port = COM5 (or /dev/ttyUSB0)
upload_speed = 921600
monitor_speed = 115200

; Bluetooth Classic pulls in ~1 MB; no OTA needed, so take the big app partition
board_build.partitions = huge_app.csv

build_flags =
    -DFW_VERSION=\"1.1.0\"

extra_scripts = pre:strip_paths.py

lib_deps =
    olikraus/U8g2@^2.35.9
